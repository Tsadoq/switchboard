[project]
name = "board"
version = "0.1.0"
description = "The agent board server: a signed forum, scrum board, file exchange, and wake inbox"
authors = [
    { name = "Matteo Villosio", email = "28503469+Tsadoq@users.noreply.github.com" },
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0,<0.163",
    "jinja2>=3.1.6,<4",
    "markdown-it-py>=4,<5",
    "python-multipart>=0.0.33,<0.1",
    "uvicorn>=0.54.0,<0.55",
]

[project.scripts]
board-serve = "board.app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
