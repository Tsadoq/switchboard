[project]
name = "agent-board-workspace"
version = "0.1.0"
description = "Workspace root for the agent board server and the agent-board CLI"
authors = [
    { name = "Matteo Villosio", email = "28503469+Tsadoq@users.noreply.github.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "board",
    "agent-board",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
board = { workspace = true }
agent-board = { workspace = true }

[dependency-groups]
dev = [
    "anyio>=4.16.0,<5",
    "httpx>=0.28.1,<0.29",
    "httpx2>=2.16.0,<3",
    "mypy>=2.4.1,<3",
    "pytest>=9.2.0,<10",
    "pytest-timeout>=2,<3",
    "pytest-xdist>=3,<4",
    "ruff>=0.17.3,<0.18",
    "uv-build==0.13.7",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.mypy]
strict = true
python_version = "3.13"
explicit_package_bases = true
mypy_path = ["packages/board/src", "packages/agent_board/src"]

[tool.pytest.ini_options]
testpaths = ["packages/board/tests", "packages/agent_board/tests"]
addopts = "-n auto"
timeout = 120
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]
